<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코엔에프 | 공식 링크 허브</title>
  <meta name="description" content="코엔에프(CO.EN.F) 공식 SNS, 구매처, 담당자 연락처, 홍보자료를 한 곳에서 확인하세요.">
  <meta name="theme-color" content="#123b67">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="코엔에프">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div class="brand">
        <span class="brand-mark">C</span>
        <div><strong>코엔에프</strong><small>CO.EN.F OFFICIAL LINK HUB</small></div>
      </div>
      <div class="hero-grid">
        <div>
          <p class="eyebrow">OFFICIAL CHANNEL &amp; SHOP</p>
          <h1>코엔에프의 모든 소식을<br>한 곳에서 만나보세요.</h1>
          <p class="hero-copy">공식 SNS부터 구매처, 홍보자료와 담당자 연락처까지 <br>빠르게 연결해 드립니다.</p>
        </div>
        <div class="qr-card">
          <button type="button" class="qr-box" id="qr-open" aria-label="QR 코드 크게 보기" style="display:block;border:0;padding:0;background:white;cursor:pointer"><img src="assets/qr.svg" alt="링크 허브 QR 코드" width="94" height="94" onerror="this.parentNode.classList.add('empty')"></button>
          <small>QR로 바로 접속</small>
        </div>
      </div>
    </header>

    <div class="content">
      <section>
        <div class="section-title"><h2>공식 SNS</h2><small>FOLLOW &amp; WATCH</small></div>
        <div class="social-grid" data-group="sns"></div>
      </section>
      <section>
        <div class="section-title"><h2>구매하기</h2><small>SHOP NOW</small></div>
        <div class="purchase-list" data-group="shop"></div>
      </section>
      <section>
        <div class="section-title"><h2>문의하기</h2><small>CONTACT</small></div>
        <div class="contact-grid" data-group="contact"></div>
      </section>
      <section>
        <div class="section-title"><h2>홍보자료</h2><small>GOOGLE DRIVE</small></div>
        <div class="resources" data-group="resource"></div>
        <div data-group="drive"></div>
      </section>
    </div>

    <footer>CO.EN.F · 공식 링크 허브 · QR / 링크 공유용</footer>
  </main>
  <dialog id="qr-dialog" aria-labelledby="qr-title" style="width:min(420px, calc(100% - 32px)); max-width:none; border:0; border-radius:20px; padding:24px; text-align:center; box-shadow:0 18px 60px #0005;">
    <h2 id="qr-title" style="margin:0 0 10px; color:#123b67; font-size:20px;">코엔에프 링크 허브</h2>
    <p style="margin:0 0 12px; color:#52657a; font-size:14px;">휴대전화 카메라로 QR 코드를 스캔하세요.</p>
    <img src="assets/qr.svg" alt="코엔에프 링크 허브 접속 QR 코드" width="1024" height="1024" style="display:block; width:min(100%, 320px); height:auto; margin:0 auto;">
    <form method="dialog"><button type="submit" style="margin-top:14px; padding:10px 30px; border:0; border-radius:9px; background:#123b67; color:white; font-weight:700; cursor:pointer;">닫기</button></form>
  </dialog>
  <style>#qr-dialog::backdrop { background: rgba(4, 18, 35, .72); }</style>
  <script>
    (() => {
      const dialog = document.getElementById('qr-dialog');
      document.getElementById('qr-open').addEventListener('click', () => dialog.showModal());
      dialog.addEventListener('click', (event) => { if (event.target === dialog) dialog.close(); });
    })();
  </script>
  <noscript><p style="text-align:center;padding:20px">링크를 보려면 JavaScript를 켜주세요.</p></noscript>
  <script src="script.js"></script>
  <script>if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("./service-worker.js").catch(function (err) { console.warn("Service worker registration failed:", err); }); }); }</script>
</body>
</html>
