<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>코엔에프 | 공식 링크 허브</title>
  <meta name="description" content="코엔에프(CO.EN.F) 공식 SNS, 구매처, 담당자 연락처, 홍보자료를 한 곳에서 확인하세요.">
  <meta name="theme-color" content="#123b67">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <div class="brand">
        <span class="brand-mark">C</span>
        <div><strong>코엔에프</strong><small>CO.EN.F OFFICIAL LINK HUB</small></div>
      </div>
      <div class="hero-grid">
        <div>
          <p class="eyebrow">OFFICIAL CHANNEL &amp; SHOP</p>
          <h1>코엔에프의 모든 소식을<br>한 곳에서 만나보세요.</h1>
          <p class="hero-copy">공식 SNS부터 구매처, 홍보자료와 담당자 연락처까지<br>빠르게 연결해 드립니다.</p>
        </div>
        <div class="qr-card">
          <div class="qr-box"><img src="assets/qr.svg" alt="링크 허브 QR 코드" width="94" height="94" onerror="this.parentNode.classList.add('empty')"></div>
          <small>QR로 바로 접속</small>
        </div>
      </div>
    </header>

    <div class="content">
      <section>
        <div class="section-title"><h2>공식 SNS</h2><small>FOLLOW &amp; WATCH</small></div>
        <div class="social-grid" data-group="sns"></div>
      </section>
      <section>
        <div class="section-title"><h2>구매하기</h2><small>SHOP NOW</small></div>
        <div class="purchase-list" data-group="shop"></div>
      </section>
      <section>
        <div class="section-title"><h2>문의하기</h2><small>CONTACT</small></div>
        <div class="contact-grid" data-group="contact"></div>
      </section>
      <section>
        <div class="section-title"><h2>홍보자료</h2><small>GOOGLE DRIVE</small></div>
        <div class="resources" data-group="resource"></div>
        <div data-group="drive"></div>
      </section>
    </div>

    <footer>CO.EN.F · 공식 링크 허브 · QR / 링크 공유용</footer>
  </main>
  <noscript><p style="text-align:center;padding:20px">링크를 보려면 JavaScript를 켜주세요.</p></noscript>
  <script src="script.js"></script>
</body>
</html>
